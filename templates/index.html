<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Folio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% include '_head.html' %}
</head>
<body>
<div class="app">

<header>
  <div class="hdr-left">
    <button class="back-btn" id="btn-back" data-ico="chevL">Journal</button>
    <div class="wordmark"><span class="wordmark-badge" id="wm-badge"></span>Folio</div>
  </div>
  <div class="hdr-right">
    <div class="view-tabs">
      <button class="view-tab active" data-view="list" data-ico="list">Journal</button>
      <button class="view-tab" data-view="map" data-ico="map">Map</button>
    </div>
    <button class="btn btn-gold" id="btn-new" title="New entry" data-ico="plus"></button>
  </div>
</header>

<aside>
  <div class="sb-sec">
    <div class="search-wrap" data-ico="search"><input type="search" id="search-input" placeholder="Search"></div>
  </div>
  <div class="sb-sec">
    <div class="sort-pills">
      <button class="pill active" data-sort="date">Date</button>
      <button class="pill" data-sort="event">Event</button>
      <button class="pill" data-sort="place">Place</button>
    </div>
    <div class="filter-row">
      <select id="filter-event"><option value="">All events</option></select>
      <select id="filter-place"><option value="">All places</option></select>
    </div>
    <button id="btn-clear">Clear filters</button>
  </div>
  <div class="entry-list" id="entry-list"><div class="no-entries">No entries yet</div></div>
</aside>

<main>
  <div class="view active" id="view-list">
  </div>
  <div class="view" id="view-map">
    <div id="world-map"></div>
    <div class="map-empty" id="map-empty" style="display:none">
      <p>No mapped entries yet</p>
    </div>
  </div>
</main>
</div>

<div class="lightbox hidden" id="lightbox"><img id="lb-img" src="" alt=""><video id="lb-vid" controls playsinline hidden></video></div>
<div class="sheet hidden" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-card"></div></div>
<div class="toast" id="toast"></div>

<script src="/static/common.js?v={{ asset_v }}"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
let entries=[], activeId=null, sort='date', filterEvent='', filterPlace='', searchQ='';
let worldMap=null, worldLayers=[], pickMap=null, pickMarker=null;
let currentView='list';
let homeShown=true, allEntries=[];
const LOCKED={{ 'true' if locked else 'false' }};
let driveConnected=false;

// ── Icons ───────────────────────────────────────────────────────────────
document.querySelectorAll('[data-ico]').forEach(el=>el.insertAdjacentHTML('afterbegin',ico(el.dataset.ico)));
document.getElementById('wm-badge').innerHTML=ico('book');

// ── API ────────────────────────────────────────────────────────────────────
// A 401 means the passcode session ended (or was never started): go back to the lock screen
const json=r=>{if(r.status===401){location.href='/login';return new Promise(()=>{});}return r.json();};
const api={
  get:    u      =>fetch(u).then(json),
  post:   (u,d)  =>fetch(u,{method:'POST',  headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(json),
  put:    (u,d)  =>fetch(u,{method:'PUT',   headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(json),
  del:    u      =>fetch(u,{method:'DELETE'}).then(json),
  upload: (u,fd) =>fetch(u,{method:'POST',  body:fd}).then(json),
};

// ── Load ───────────────────────────────────────────────────────────────────
async function loadEntries(){
  const p=new URLSearchParams({sort,event:filterEvent,place:filterPlace,search:searchQ});
  entries=await api.get(`/api/entries?${p}`);
  allEntries=(filterEvent||filterPlace||searchQ)?await api.get('/api/entries'):entries;
  renderSidebar(); await loadMeta();
  if(homeShown&&!detailOpen()&&!phone.matches) showHome();
  if(currentView==='map') refreshWorldMap();
}
async function loadMeta(){
  const [evs,pls]=await Promise.all([api.get('/api/meta/events'),api.get('/api/meta/places')]);
  const ev=document.getElementById('filter-event').value, pl=document.getElementById('filter-place').value;
  document.getElementById('filter-event').innerHTML='<option value="">All events</option>'+evs.map(e=>`<option>${e}</option>`).join('');
  document.getElementById('filter-place').innerHTML='<option value="">All places</option>'+pls.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('filter-event').value=ev; document.getElementById('filter-place').value=pl;
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function renderSidebar(){
  const list=document.getElementById('entry-list');
  let html=`<div class="entry-item hl-item${homeShown?' active':''}" id="hl-item">
    <span class="hl-icon">${ico('sparkle')}</span><div><div class="ei-title"><span>Highlights</span></div>
    <div class="ei-meta"><span>On this day, trips &amp; your year</span></div></div></div>`, lastGroup=null;
  if(!entries.length) html+='<div class="no-entries">No entries found</div>';
  entries.forEach(e=>{
    const group=sort==='event'?(e.event||'—'):sort==='place'?(e.place||'—'):(e.entry_date||'—').slice(0,7);
    if(group!==lastGroup){html+=`<div class="grp-hdr">${sort==='date'?fmtMonth(group):group}</div>`;lastGroup=group;}
    const hasTrack=e.tracks&&e.tracks.length>0, hasPin=e.lat&&e.lng;
    const badges=(e.photos&&e.photos.length?ico('photo'):'')+(hasTrack?ico('route'):hasPin?ico('pin'):'');
    html+=`<div class="entry-item${e.id===activeId?' active':''}" data-id="${e.id}">
      <div class="ei-title"><span>${esc(e.title)}</span><span class="ei-badges">${badges}</span></div>
      <div class="ei-meta"><span>${fmtDate(e.entry_date)}</span>${e.place?`<span class="ei-tag">${esc(e.place)}</span>`:e.event?`<span class="ei-tag">${esc(e.event)}</span>`:''}</div>
    </div>`;
  });
  list.innerHTML=html;
  list.querySelectorAll('.entry-item[data-id]').forEach(el=>el.addEventListener('click',()=>{switchToListView();openEntry(el.dataset.id);}));
  document.getElementById('hl-item').addEventListener('click',()=>{switchToListView();showHome(true);});
}

// ── Detail ─────────────────────────────────────────────────────────────────
async function openEntry(id){
  activeId=id; homeShown=false;
  renderSidebar();
  const e=await api.get(`/api/entries/${id}`);
  if(activeId!==id) return;   // the user clicked something else while this loaded

  const chips=[
    e.place?`<span class="chip">${ico('pin')}${esc(e.place)}</span>`:'',
    e.event?`<button class="chip chip-link" data-trip="${esc(e.event)}" onclick="openTrip(this.dataset.trip)">${ico('tag')}${esc(e.event)}${ico('chevR')}</button>`:'',
    weatherChip(e.weather),
    (e.tracks&&e.tracks.length)?`<span class="chip">${ico('route')}${e.tracks.map(t=>t.distance_km?t.distance_km+' km':'').filter(Boolean).join(' + ')||e.tracks.length+' route'}</span>`:'',
    (e.lat&&e.lng&&!(e.tracks&&e.tracks.length)&&!e.place)?`<span class="chip">${ico('pin')}Pinned</span>`:'',
  ].filter(Boolean).join('');

  const photos=e.photos.map(p=>`
    <div class="photo-thumb" onclick="openLB('${p.url}','${p.kind}')">
      ${photoTile(p,`<button class="photo-del" title="Delete" onclick="delPhoto('${p.id}','${id}',event)">${ico('xmark')}</button>`)}
    </div>`).join('');

  // Photos taken on another day than the entry's date? Offer to fix the date.
  let dateHint='';
  const taken=[...new Set(e.photos.map(p=>p.taken_at&&p.taken_at.slice(0,10)).filter(Boolean))];
  if(taken.length===1&&taken[0]!==e.entry_date&&!dismissedHint(id,taken[0])){
    dateHint=`<div class="hint-card">${ico('calendar')}<div>These photos were taken on <b>${fmtLongDate(taken[0])}</b>.</div>
      <button class="btn btn-sm" onclick="useDate('${id}','${taken[0]}')">Use this date</button>
      <button class="btn btn-sm btn-plain" title="Dismiss" onclick="dismissHint('${id}','${taken[0]}')">${ico('xmark')}</button></div>`;
  }

  let trackSection='';
  if(e.tracks&&e.tracks.length){
    const trackItems=e.tracks.map(t=>`
      <div class="track-item" id="ti-${t.id}">
        <span class="track-item-name">${ico('route')}${esc(t.track_name||t.original_name||'Track')}</span>
        <span class="track-item-dist">${t.distance_km?t.distance_km+' km':''}${t.ascent_m?` · ↑ ${fmtNum(t.ascent_m)} m`:''}</span>
        <button class="btn btn-plain btn-sm" style="color:var(--red)" title="Remove track" onclick="delTrack('${t.id}','${id}',event)">${ico('trash')}</button>
      </div>`).join('');
    trackSection=`
      <div class="section-title">Route<span>${e.tracks.map(t=>t.distance_km?t.distance_km+' km':'').filter(Boolean).join(' + ')}</span></div>
      <div class="track-map-wrap">
        <div class="track-map" id="detail-track-map-${id}"></div>
        <div class="elev" id="elev-${id}"></div>
        <div class="track-list">${trackItems}</div>
      </div>`;
  }

  setListContent(`<div class="scroll-wrap"><div>
    <div class="detail-top">
      <div class="detail-date">${fmtLongDate(e.entry_date)}</div>
      <div class="detail-actions">
        <button class="btn btn-icon${e.shared?' btn-on':''}" title="Share" onclick="openShare('${id}')">${ico('share')}</button>
        <button class="btn btn-sm" onclick="openEditForm('${id}')">${ico('pencil')}Edit</button>
        <button class="btn btn-icon btn-danger" title="Delete entry" onclick="delEntry('${id}')">${ico('trash')}</button>
      </div>
    </div>
    <div class="detail-title">${esc(e.title)}</div>
    ${chips?`<div class="chips" id="chips-${id}">${chips}</div>`:`<div class="chips" id="chips-${id}"></div>`}
    <div class="detail-body">${esc(e.body||'')}</div>
    <div class="section-title">Photos &amp; Videos<span>${e.photos.length||''}</span></div>
    ${dateHint}
    <div class="photo-grid" id="pg-${id}">${photos}</div>
    <div class="upload-row">
    <div class="drop-area" id="drop-img-${id}">
      <input type="file" id="fi-${id}" accept="image/*,video/*" multiple>
      ${ico('photo')}<span id="drop-label-${id}">Add photos or videos${driveConnected?' · Google Drive':''}</span>
    </div>
    <div class="gpx-drop" id="drop-gpx-${id}">
      <input type="file" id="fg-${id}" accept=".gpx">
      ${ico('route')}Add GPX route
    </div>
    </div>
    ${trackSection}
  </div></div>`);

  openDetail();
  wireDropArea(`drop-img-${id}`, `fi-${id}`, files=>uploadFiles(id,files));
  wireDropArea(`drop-gpx-${id}`, `fg-${id}`, files=>uploadGpx(id,files[0]));

  if(e.tracks&&e.tracks.length){
    setTimeout(()=>renderRoute(document.getElementById(`detail-track-map-${id}`),e.tracks,document.getElementById(`elev-${id}`)),80);
  }
  // Older entries get their weather looked up the first time they're opened
  if(e.weather===null&&e.lat&&e.lng){
    api.post(`/api/entries/${id}/weather`).then(w=>{
      const c=document.getElementById(`chips-${id}`);
      if(c&&w&&w.code!=null) c.insertAdjacentHTML('beforeend',weatherChip(w));
    });
  }
}

function dismissedHint(id,d){try{return localStorage.getItem(`folio-hint-${id}`)===d;}catch{return false;}}
function dismissHint(id,d){try{localStorage.setItem(`folio-hint-${id}`,d);}catch{} openEntry(id);}
async function useDate(id,d){await api.put(`/api/entries/${id}`,{entry_date:d});toast('Date updated');await loadEntries();openEntry(id);}

// ── Sharing ──────────────────────────────────────────────────────────────────
async function openShare(id){
  const e=await api.get(`/api/entries/${id}`);
  const link=e.shared?(await api.post(`/api/entries/${id}/share`)).url:null;
  showSheet(`
    <div class="sheet-title">${ico('share')}Share “${esc(e.title)}”</div>
    ${link?`
      <p class="sheet-text">Anyone with this link can view this entry, but can't see the rest of your journal or change anything.</p>
      <div class="share-link"><input type="text" readonly value="${esc(link)}" onclick="this.select()"><button class="btn btn-sm" data-url="${esc(link)}" onclick="copyLink(this.dataset.url)">${ico('copy')}Copy</button></div>
      <div class="sheet-actions">
        ${navigator.share?`<button class="btn btn-gold" data-title="${esc(e.title)}" data-url="${esc(link)}" onclick="navigator.share({title:this.dataset.title,url:this.dataset.url}).catch(()=>{})">${ico('share')}Send…</button>`:''}
        <button class="btn btn-danger" onclick="stopSharing('${id}')">Stop sharing</button>
      </div>`:`
      <p class="sheet-text">Create a private link to this one entry. People with the link can view it without the passcode, but can't see anything else or make changes. You can switch the link off at any time.</p>
      <div class="sheet-actions"><button class="btn btn-gold" onclick="startSharing('${id}')">Create link</button><button class="btn" onclick="closeSheet()">Cancel</button></div>`}
  `);
}
async function startSharing(id){await api.post(`/api/entries/${id}/share`);openShare(id);openEntry(id);}
async function stopSharing(id){await api.del(`/api/entries/${id}/share`);closeSheet();toast('Link switched off');openEntry(id);}
function copyLink(url){navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Couldn’t copy — select the link instead'));}
function showSheet(html){
  const s=document.getElementById('sheet');
  s.querySelector('.sheet-card').innerHTML=html;
  s.classList.remove('hidden');
}
function closeSheet(){document.getElementById('sheet').classList.add('hidden');}

async function uploadFiles(id,files){
  if(!files||!files.length) return;
  files=[...files];
  let saved=0;
  if(driveConnected){
    const label=document.getElementById(`drop-label-${id}`);
    for(const [n,f] of files.entries()){
      try{
        await uploadToDrive(id,f,pct=>{if(label)label.textContent=`Uploading ${n+1} of ${files.length} — ${pct}%`;});
        saved++;
      }catch(err){toast(`${f.name}: ${err.message}`);}
    }
  }else{
    const fd=new FormData();
    files.forEach(f=>fd.append('photos',f));
    saved=(await api.upload(`/api/entries/${id}/photos`,fd)).length;
  }
  toast(`Uploaded ${saved} file${saved!==1?'s':''}`);
  openEntry(id);
}

// The browser sends the file straight to Google Drive, so big videos never pass through the server
async function uploadToDrive(id,file,onProgress){
  const start=await api.post(`/api/entries/${id}/media/start`,{name:file.name,mime:file.type,size:file.size});
  if(start.error) throw new Error(start.error);
  const driveFile=await new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();
    x.open('PUT',start.upload_url);
    x.upload.onprogress=ev=>{if(ev.lengthComputable)onProgress(Math.round(ev.loaded/ev.total*100));};
    x.onload=()=>x.status<300?resolve(JSON.parse(x.responseText)):reject(new Error(`Drive upload failed (${x.status})`));
    x.onerror=()=>reject(new Error('Network error during upload'));
    x.send(file);
  });
  const done=await api.post(`/api/entries/${id}/media/finish`,{drive_id:driveFile.id});
  if(done.error) throw new Error(done.error);
}

async function uploadGpx(id,file){
  if(!file) return;
  toast('Parsing GPX…');
  const fd=new FormData(); fd.append('gpx',file);
  const res=await api.upload(`/api/entries/${id}/tracks`,fd);
  if(res.error){toast(`Error: ${res.error}`);return;}
  toast(`Track loaded — ${res.distance_km?res.distance_km+' km':res.points.length+' pts'}`);
  await loadEntries();
  openEntry(id);
}

async function delPhoto(pid,eid,ev){
  ev.stopPropagation();
  if(!confirm('Delete photo?')) return;
  await api.del(`/api/photos/${pid}`); toast('Photo deleted'); openEntry(eid);
}

async function delTrack(tid,eid,ev){
  ev.stopPropagation();
  if(!confirm('Remove this track?')) return;
  await api.del(`/api/tracks/${tid}`); toast('Track removed');
  await loadEntries(); openEntry(eid);
}

async function delEntry(id){
  if(!confirm('Delete this entry and all its photos and tracks?')) return;
  await api.del(`/api/entries/${id}`); activeId=null;
  toast('Entry deleted'); await loadEntries(); showEmpty();
}

// ── Forms ─────────────────────────────────────────────────────────────────
function openNewForm(){activeId=null;homeShown=false;renderSidebar();renderForm({title:'',body:'',event:'',place:'',entry_date:today(),lat:null,lng:null},false);}
async function openEditForm(id){activeId=id;homeShown=false;renderSidebar();const e=await api.get(`/api/entries/${id}`);renderForm(e,true);}

function renderForm(e,isEdit){
  setListContent(`<div class="scroll-wrap"><form onsubmit="return false">
    <div class="form-title">${isEdit?'Edit Entry':'New Entry'}</div>

    <div class="group">
      <div class="group-row"><input class="f-field f-title" id="f-title" placeholder="Title" value="${esc(e.title)}"></div>
      <div class="group-row tall"><textarea class="f-field f-body" id="f-body" placeholder="Write your thoughts…">${esc(e.body||'')}</textarea>
        ${SpeechRec?`<button type="button" class="mic-btn" id="btn-mic" title="Dictate" onclick="toggleDictation()">${ico('mic')}</button>`:''}</div>
    </div>

    <label class="f-lbl">Details</label>
    <div class="group">
      <div class="group-row"><label for="f-date">Date</label><span style="flex:1"></span><input type="date" id="f-date" value="${e.entry_date||today()}"></div>
      <div class="group-row"><label for="f-event">Event</label><input class="f-field" id="f-event" placeholder="Road trip" value="${esc(e.event||'')}"></div>
      <div class="group-row"><label for="f-place">Place</label><input class="f-field" id="f-place" placeholder="Kelowna" value="${esc(e.place||'')}"></div>
    </div>

    <label class="f-lbl">Location</label>
    <div class="group">
      <div class="loc-row">
        <div class="loc-coords" id="coord-display">${e.lat&&e.lng?`${e.lat.toFixed(5)}, ${e.lng.toFixed(5)}`:'Not set'}</div>
        <button type="button" class="btn btn-sm btn-plain" id="btn-toggle-map">Choose on Map</button>
      </div>
      <div id="pick-map"></div>
    </div>
    <div class="hint">Tap the map to drop a pin. Adding a GPX route also sets this automatically.</div>
    <input type="hidden" id="f-lat" value="${e.lat||''}">
    <input type="hidden" id="f-lng" value="${e.lng||''}">

    <div class="f-actions">
      <button type="button" class="btn btn-gold" onclick="${isEdit?`saveEdit('${e.id}')`:'saveNew()'}">
        ${isEdit?'Save':'Save Entry'}
      </button>
      <button type="button" class="btn" onclick="${isEdit?`openEntry('${e.id}')`:'showEmpty()'}">Cancel</button>
      ${isEdit?`<button type="button" class="btn btn-danger" style="margin-left:auto" onclick="delEntry('${e.id}')">${ico('trash')}Delete</button>`:''}
    </div>
  </form></div>`);
  openDetail();

  setTimeout(()=>{
    const btn=document.getElementById('btn-toggle-map');
    const container=document.getElementById('pick-map');
    let shown=false;
    btn.addEventListener('click',()=>{
      shown=!shown; container.classList.toggle('visible',shown);
      btn.textContent=shown?'Done':'Choose on Map';
      if(shown&&!pickMap){
        const iLat=parseFloat(document.getElementById('f-lat').value)||51;
        const iLng=parseFloat(document.getElementById('f-lng').value)||0;
        pickMap=L.map('pick-map').setView([iLat,iLng],e.lat?10:2);
        addBaseTiles(pickMap);
        if(e.lat&&e.lng) pickMarker=L.circleMarker([e.lat,e.lng],pinStyle()).addTo(pickMap);
        pickMap.on('click',ev=>{
          const{lat,lng}=ev.latlng;
          document.getElementById('f-lat').value=lat;
          document.getElementById('f-lng').value=lng;
          document.getElementById('coord-display').textContent=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          if(pickMarker) pickMap.removeLayer(pickMarker);
          pickMarker=L.circleMarker([lat,lng],pinStyle()).addTo(pickMap);
        });
      } else if(shown&&pickMap) setTimeout(()=>pickMap.invalidateSize(),50);
    });
  },60);
}

// ── Dictation (Web Speech API: Safari and Chrome) ────────────────────────────
const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function toggleDictation(){
  if(rec){rec.stop();return;}
  const ta=document.getElementById('f-body'), btn=document.getElementById('btn-mic');
  rec=new SpeechRec(); rec.lang=navigator.language||'en-GB'; rec.continuous=true; rec.interimResults=true;
  let base=ta.value&&!/\s$/.test(ta.value)?ta.value+' ':ta.value;
  rec.onresult=ev=>{
    let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal){base+=t.trim()+' ';}else interim+=t;
    }
    ta.value=base+interim;
  };
  rec.onerror=ev=>{if(ev.error==='not-allowed')toast('Microphone access was blocked');};
  rec.onend=()=>{rec=null;btn&&btn.classList.remove('rec');ta.value=ta.value.replace(/\s+$/,'');};
  rec.start(); btn.classList.add('rec'); toast('Listening… tap the mic again to stop');
}

function getFd(){
  return{
    title:     document.getElementById('f-title').value.trim(),
    body:      document.getElementById('f-body').value.trim(),
    event:     document.getElementById('f-event').value.trim(),
    place:     document.getElementById('f-place').value.trim(),
    entry_date:document.getElementById('f-date').value,
    lat:       parseFloat(document.getElementById('f-lat').value)||null,
    lng:       parseFloat(document.getElementById('f-lng').value)||null,
  };
}
async function saveNew(){
  if(rec) rec.stop();
  const d=getFd(); if(!d.title){toast('Please add a title');return;}
  pickMap=null;pickMarker=null;
  const entry=await api.post('/api/entries',d); toast('Entry created');
  await loadEntries(); openEntry(entry.id);
}
async function saveEdit(id){
  if(rec) rec.stop();
  const d=getFd(); if(!d.title){toast('Please add a title');return;}
  pickMap=null;pickMarker=null;
  await api.put(`/api/entries/${id}`,d); toast('Saved');
  await loadEntries(); openEntry(id);
}

// ── World map ─────────────────────────────────────────────────────────────
function initWorldMap(){
  if(worldMap) return;
  worldMap=L.map('world-map').setView([30,10],2);
  addBaseTiles(worldMap);
}
function refreshWorldMap(){
  initWorldMap();
  worldLayers.forEach(l=>worldMap.removeLayer(l)); worldLayers=[];
  const mapped=entries.filter(e=>(e.lat&&e.lng)||(e.tracks&&e.tracks.length));
  document.getElementById('map-empty').style.display=mapped.length?'none':'flex';

  mapped.forEach(e=>{
    const hasTracks=e.tracks&&e.tracks.length>0;
    if(hasTracks){
      e.tracks.forEach(t=>{
        if(!t.points||!t.points.length) return;
        const line=L.polyline(t.points,{color:'#0a84ff',weight:3.5,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(worldMap);
        const distStr=t.distance_km?`${t.distance_km} km`:'';
        const tags=[e.place,e.event].filter(Boolean).map(esc).join(' · ');
        line.bindPopup(`
          <div class="map-popup-title">${esc(e.title)}</div>
          <div class="map-popup-meta">${fmtDate(e.entry_date)}${tags?' · '+tags:''}</div>
          ${distStr?`<div class="map-popup-dist">${distStr}</div>`:''}
          <div class="map-popup-link" onclick="viewFromMap('${e.id}')">Open entry →</div>`,{maxWidth:240});
        worldLayers.push(line);
      });
      // start pin
      const s=e.tracks[0].points[0], cover=firstImage([e]);
      if(s){
        const m=(cover?L.marker(s,{icon:photoPin(cover.thumb_url)}):L.circleMarker(s,pinStyle(6))).addTo(worldMap);
        m.on('click',()=>viewFromMap(e.id));
        worldLayers.push(m);
      }
    } else if(e.lat&&e.lng){
      const cover=firstImage([e]);
      const m=(cover?L.marker([e.lat,e.lng],{icon:photoPin(cover.thumb_url)}):L.circleMarker([e.lat,e.lng],pinStyle(8))).addTo(worldMap);
      const tags=[e.place,e.event].filter(Boolean).map(esc).join(' · ');
      m.bindPopup(`
        <div class="map-popup-title">${esc(e.title)}</div>
        <div class="map-popup-meta">${fmtDate(e.entry_date)}${tags?' · '+tags:''}</div>
        <div class="map-popup-link" onclick="viewFromMap('${e.id}')">Open entry →</div>`,{maxWidth:220});
      worldLayers.push(m);
    }
  });
}

function viewFromMap(id){switchToListView();openEntry(id);}

// ── Highlights: On This Day, trips, year in review ───────────────────────────
const firstImage=list=>{for(const e of list)for(const p of e.photos||[])if(p.kind==='image')return p;return null;};
const entryKm=e=>(e.tracks||[]).reduce((s,t)=>s+(t.distance_km||0),0);
const entryAscent=e=>(e.tracks||[]).reduce((s,t)=>s+(t.ascent_m||0),0);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
function yearsAgo(d){const n=new Date().getFullYear()-Number(d.slice(0,4));return n===1?'1 year ago':`${n} years ago`;}

function onThisDay(){
  const now=new Date(), md=today().slice(5), y=now.getFullYear();
  const exact=allEntries.filter(e=>e.entry_date.slice(5)===md&&Number(e.entry_date.slice(0,4))<y);
  if(exact.length) return {title:'On This Day',list:exact};
  // nothing on the exact day: widen to this week in earlier years
  const week=allEntries.filter(e=>{
    const ey=Number(e.entry_date.slice(0,4)); if(ey>=y) return false;
    const same=new Date(y,Number(e.entry_date.slice(5,7))-1,Number(e.entry_date.slice(8,10)));
    return Math.abs(same-new Date(y,now.getMonth(),now.getDate()))<=3*864e5;
  });
  return week.length?{title:'This Week in Past Years',list:week}:null;
}
function trips(){
  const by={};
  allEntries.forEach(e=>{if(e.event)(by[e.event]=by[e.event]||[]).push(e);});
  return Object.entries(by).map(([name,list])=>{
    list.sort((a,b)=>a.entry_date.localeCompare(b.entry_date));
    return {name,list,start:list[0].entry_date,end:list[list.length-1].entry_date,cover:firstImage(list)};
  }).sort((a,b)=>b.end.localeCompare(a.end));
}
function statTiles(list){
  const photos=list.reduce((s,e)=>s+(e.photos||[]).length,0);
  const places=new Set(list.map(e=>e.place).filter(Boolean)).size;
  const km=list.reduce((s,e)=>s+entryKm(e),0), up=list.reduce((s,e)=>s+entryAscent(e),0);
  return `<div class="stat-grid">
    <div class="stat"><b>${list.length}</b><span>${list.length===1?'Entry':'Entries'}</span></div>
    <div class="stat"><b>${photos}</b><span>Photos &amp; videos</span></div>
    <div class="stat"><b>${places}</b><span>${places===1?'Place':'Places'}</span></div>
    ${km?`<div class="stat"><b>${fmtNum(km,1)}<small> km</small></b><span>On the move</span></div>`:''}
    ${up?`<div class="stat"><b>${fmtNum(up)}<small> m</small></b><span>Climbed</span></div>`:''}
  </div>`;
}
function mosaic(list,max=10){
  const ps=[];list.forEach(e=>(e.photos||[]).forEach(p=>ps.push(p)));
  if(!ps.length) return '';
  return `<div class="mosaic">${ps.slice(0,max).map(p=>`<div class="photo-thumb" onclick="openLB('${p.url}','${p.kind}')">${photoTile(p)}</div>`).join('')}</div>`;
}
function entryCards(list){
  return `<div class="timeline">${list.map(e=>{
    const p=firstImage([e]);
    return `<button class="tl-item" onclick="openEntry('${e.id}')">
      ${p?`<span class="tl-thumb" style="background-image:url('${p.thumb_url}')"></span>`:`<span class="tl-thumb tl-empty">${ico('book')}</span>`}
      <span class="tl-text"><span class="tl-date">${fmtLongDate(e.entry_date)}</span><b>${esc(e.title)}</b><span class="tl-body">${esc((e.body||'').slice(0,140))}</span></span>
      ${ico('chevR')}
    </button>`;}).join('')}</div>`;
}
function backLink(){return `<button class="btn btn-plain back-link" onclick="showHome(true)">${ico('chevL')}Highlights</button>`;}
function overviewMap(elId,list){
  const el=document.getElementById(elId); if(!el) return;
  const m=L.map(el,{attributionControl:false,scrollWheelZoom:false}); addBaseTiles(m);
  const all=[];
  list.forEach(e=>{
    (e.tracks||[]).forEach(t=>{if(t.points&&t.points.length){L.polyline(t.points,{color:'#0a84ff',weight:3.5,opacity:.9,lineCap:'round'}).addTo(m);all.push(...t.points);}});
    if(e.lat&&e.lng){
      const p=firstImage([e]);
      (p?L.marker([e.lat,e.lng],{icon:photoPin(p.thumb_url,38)}):L.circleMarker([e.lat,e.lng],pinStyle(7)))
        .addTo(m).bindTooltip(esc(e.title)).on('click',()=>openEntry(e.id));
      all.push([e.lat,e.lng]);
    }
  });
  if(all.length>1) m.fitBounds(L.latLngBounds(all),{padding:[30,30],maxZoom:13}); else if(all.length) m.setView(all[0],11); else m.setView([30,10],2);
}

function showHome(fromClick){
  activeId=null; homeShown=true; renderSidebar();
  const otd=onThisDay(), ts=trips();
  const years=[...new Set(allEntries.map(e=>e.entry_date.slice(0,4)))].sort().reverse();
  const hour=new Date().getHours(), greet=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  setListContent(`<div class="scroll-wrap"><div>
    <div class="detail-date">${greet}</div>
    <div class="detail-title">Highlights</div>
    ${allEntries.length?statTiles(allEntries):`<p class="muted-text">Your journal is empty. Press + to write your first entry.</p>`}

    ${otd?`<div class="section-title">${otd.title}</div>
      <div class="memory-row">${otd.list.map(e=>{const p=firstImage([e]);return `
        <button class="memory" onclick="openEntry('${e.id}')" ${p?`style="background-image:linear-gradient(transparent 35%,rgba(0,0,0,.85)),url('${p.thumb_url}')"`:''}>
          <span class="memory-when">${yearsAgo(e.entry_date)}</span><b>${esc(e.title)}</b><span>${fmtDate(e.entry_date)}</span>
        </button>`;}).join('')}</div>`:''}

    ${years.length?`<div class="section-title">Year in Review</div>
      <div class="year-row">${years.map(y=>{const n=allEntries.filter(e=>e.entry_date.startsWith(y));const p=firstImage(n);return `
        <button class="year-card" onclick="openYear('${y}')" ${p?`style="--cover:url('${p.thumb_url}')"`:''}>
          <span class="year-num">${y}</span><span>${n.length} ${n.length===1?'entry':'entries'}</span>
        </button>`;}).join('')}</div>`:''}

    ${ts.length?`<div class="section-title">Trips &amp; Events<span>${ts.length}</span></div>
      <div class="trip-grid">${ts.map(t=>`
        <button class="trip-card" data-trip="${esc(t.name)}" onclick="openTrip(this.dataset.trip)">
          <span class="trip-cover" ${t.cover?`style="background-image:url('${t.cover.thumb_url}')"`:''}>${t.cover?'':ico('tag')}</span>
          <b>${esc(t.name)}</b>
          <span>${t.start===t.end?fmtDate(t.start):`${fmtDate(t.start)} – ${fmtDate(t.end)}`} · ${t.list.length} ${t.list.length===1?'entry':'entries'}</span>
        </button>`).join('')}</div>`:''}

    <div class="home-foot">
      ${installPrompt?`<button class="btn" onclick="installApp()">${ico('plus')}Install Folio app</button>`:''}
      ${isIOS&&!standalone?`<div class="hint-card">${ico('share')}<div>To install Folio on this iPhone, tap <b>Share</b> in Safari, then <b>Add to Home Screen</b>.</div></div>`:''}
      ${LOCKED?`<form method="post" action="/logout"><button class="btn">${ico('lock')}Lock Folio</button></form>`:''}
    </div>
  </div></div>`);
  if(fromClick) openDetail();
}

function openTrip(name){
  activeId=null; homeShown=false; renderSidebar();
  const t=trips().find(x=>x.name===name); if(!t) return;
  const days=daysBetween(t.start,t.end)+1;
  setListContent(`<div class="scroll-wrap"><div>
    ${backLink()}
    <div class="hero" ${t.cover?`style="background-image:linear-gradient(transparent 30%,rgba(0,0,0,.88)),url('${t.cover.thumb_url}')"`:''}>
      <span class="detail-date">${t.start===t.end?fmtLongDate(t.start):`${fmtDate(t.start)} – ${fmtDate(t.end)} · ${days} days`}</span>
      <div class="hero-title">${esc(t.name)}</div>
    </div>
    ${statTiles(t.list)}
    <div class="section-title">Map</div>
    <div class="track-map" id="trip-map"></div>
    ${mosaic(t.list,12)?`<div class="section-title">Photos</div>${mosaic(t.list,12)}`:''}
    <div class="section-title">Entries<span>${t.list.length}</span></div>
    ${entryCards(t.list)}
  </div></div>`);
  openDetail();
  setTimeout(()=>overviewMap('trip-map',t.list),60);
}

function openYear(y){
  activeId=null; homeShown=false; renderSidebar();
  const list=allEntries.filter(e=>e.entry_date.startsWith(y)).sort((a,b)=>a.entry_date.localeCompare(b.entry_date));
  const years=[...new Set(allEntries.map(e=>e.entry_date.slice(0,4)))].sort();
  const perMonth=Array.from({length:12},(_,m)=>list.filter(e=>Number(e.entry_date.slice(5,7))===m+1).length);
  const max=Math.max(1,...perMonth), busiest=perMonth.indexOf(Math.max(...perMonth));
  const places={}; list.forEach(e=>{if(e.place)places[e.place]=(places[e.place]||0)+1;});
  const topPlaces=Object.entries(places).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const longest=list.filter(e=>entryKm(e)).sort((a,b)=>entryKm(b)-entryKm(a))[0];
  const months=['J','F','M','A','M','J','J','A','S','O','N','D'];
  setListContent(`<div class="scroll-wrap"><div>
    ${backLink()}
    <div class="year-switch">${years.map(x=>`<button class="pill${x===y?' active':''}" onclick="openYear('${x}')">${x}</button>`).join('')}</div>
    <div class="hero hero-year"><span class="detail-date">Year in Review</span><div class="hero-title">${y}</div></div>
    ${statTiles(list)}
    <div class="section-title">Month by Month${list.length?`<span>Busiest: ${new Date(2000,busiest,1).toLocaleDateString('en-GB',{month:'long'})}</span>`:''}</div>
    <div class="bars">${perMonth.map((n,i)=>`<div class="bar"><div class="bar-fill" style="height:${n/max*100}%" title="${n}">${n?`<span>${n}</span>`:''}</div><small>${months[i]}</small></div>`).join('')}</div>
    ${topPlaces.length||longest?`<div class="facts">
      ${topPlaces.length?`<div class="fact"><div class="fact-label">${ico('pin')}Top places</div>${topPlaces.map(([p,n])=>`<div class="fact-row"><span>${esc(p)}</span><b>${n}</b></div>`).join('')}</div>`:''}
      ${longest?`<button class="fact" onclick="openEntry('${longest.id}')"><div class="fact-label">${ico('route')}Longest route</div><div class="fact-big">${fmtNum(entryKm(longest),1)} km</div><div class="fact-sub">${esc(longest.title)} · ${fmtDate(longest.entry_date)}</div></button>`:''}
    </div>`:''}
    <div class="section-title">Everywhere You Went</div>
    <div class="track-map" id="year-map"></div>
    ${mosaic(list,15)?`<div class="section-title">Photos</div>${mosaic(list,15)}`:''}
  </div></div>`);
  openDetail();
  setTimeout(()=>overviewMap('year-map',list),60);
}

// ── Install as an app ────────────────────────────────────────────────────────
let installPrompt=null;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installPrompt=ev;if(homeShown)showHome();});
async function installApp(){if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;if(homeShown)showHome();}
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

// ── View switching ────────────────────────────────────────────────────────
// On phones the detail pane slides over the list; it gets a history entry so the
// system back gesture returns to the list instead of leaving the app.
const appEl=document.querySelector('.app');
const phone=matchMedia('(max-width:760px)');
let detailPushed=false;
function detailOpen(){return appEl.classList.contains('detail-open');}
function openDetail(){
  if(detailOpen()) return;
  appEl.classList.add('detail-open');
  if(phone.matches){history.pushState({detail:1},'');detailPushed=true;}
}
function closeDetail(){
  if(!detailOpen()) return;
  appEl.classList.remove('detail-open');
  if(detailPushed){detailPushed=false;history.back();}
}
function goBack(){closeDetail();activeId=null;homeShown=false;renderSidebar();}
window.addEventListener('popstate',()=>{detailPushed=false;if(detailOpen())goBack();});
function setMapMode(on){
  if(appEl.classList.contains('map-mode')===on) return;
  appEl.classList.add('no-anim');
  appEl.classList.toggle('map-mode',on);
  requestAnimationFrame(()=>requestAnimationFrame(()=>appEl.classList.remove('no-anim')));
}
function switchToListView(){
  currentView='list'; setMapMode(false);
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-map').classList.remove('active');
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view==='list'));
}
function switchToMapView(){
  currentView='map'; setMapMode(true);
  document.getElementById('view-map').classList.add('active');
  document.getElementById('view-list').classList.remove('active');
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view==='map'));
  setTimeout(()=>{initWorldMap();worldMap.invalidateSize();refreshWorldMap();},50);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setListContent(html){document.getElementById('view-list').innerHTML=html;}
function showEmpty(){
  // On phones, let the pane slide away before swapping its contents
  if(phone.matches&&detailOpen()){activeId=null;renderSidebar();closeDetail();setTimeout(()=>{if(!detailOpen())showEmpty();},450);return;}
  showHome();
}
function today(){return new Date().toISOString().slice(0,10);}
function wireDropArea(dropId,inputId,cb){
  const d=document.getElementById(dropId),i=document.getElementById(inputId);
  d.addEventListener('click',()=>i.click());
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('drag-over');});
  d.addEventListener('dragleave',()=>d.classList.remove('drag-over'));
  d.addEventListener('drop',async e=>{e.preventDefault();d.classList.remove('drag-over');await cb(e.dataTransfer.files);});
  i.addEventListener('change',async()=>await cb(i.files));
}
let _t; function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>el.classList.remove('show'),2800);}

wireLightbox();

// ── Events ────────────────────────────────────────────────────────────────
document.getElementById('btn-back').addEventListener('click',goBack);
document.getElementById('btn-new').addEventListener('click',()=>{switchToListView();openNewForm();});
document.querySelectorAll('.view-tab').forEach(tab=>tab.addEventListener('click',()=>tab.dataset.view==='map'?switchToMapView():switchToListView()));
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');sort=p.dataset.sort;loadEntries();}));
let _s; document.getElementById('search-input').addEventListener('input',e=>{clearTimeout(_s);searchQ=e.target.value.trim();_s=setTimeout(loadEntries,300);});
document.getElementById('filter-event').addEventListener('change',e=>{filterEvent=e.target.value;loadEntries();});
document.getElementById('filter-place').addEventListener('change',e=>{filterPlace=e.target.value;loadEntries();});
document.getElementById('btn-clear').addEventListener('click',()=>{filterEvent='';filterPlace='';document.getElementById('filter-event').value='';document.getElementById('filter-place').value='';loadEntries();});

homeShown=!phone.matches;
api.get('/api/drive/status').then(s=>{driveConnected=s.connected;}).catch(()=>{});
if(new URLSearchParams(location.search).get('drive')==='connected'){
  history.replaceState(null,'','/'); setTimeout(()=>toast('Google Drive connected'),300);
}
loadEntries();
</script>
